[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-allocation"
version = "1.0.0"
description = "LLM-guided resource allocation for multi-objective Bayesian optimization of alloy design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch==2.11.0",
    "botorch==0.17.2",
    "gpytorch==1.15.2",
    "linear_operator==0.6.1",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "openpyxl==3.1.5",
    "scikit-learn==1.8.0",
    "Pillow==12.2.0",
    "imageio==2.37.3",
    "joblib==1.5.3",
    "python-dotenv==1.2.2",
    "langchain-openai==1.2.1",
    "openai==2.36.0",
    "plotly==6.7.0",
]

[project.optional-dependencies]
# Only needed to run ground_truth.ipynb or retrain the ground-truth surrogate models
# via resource_allocation/armote_multi_output.py. The BO loop does not import these.
surrogate = [
    "optuna==4.8.0",
    "xgboost==3.2.0",
    "tensorflow==2.21.0",
    "ipykernel==7.4.0",
]
dev = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
